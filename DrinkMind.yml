    - data:
        classes:
        - id: '1'
          label: 身体不适或危险现状
          name: '用户描述喝饮品后出现心悸、持续心跳过快、胸痛、呼吸困难、晕厥、严重头晕、持续呕吐或明显身体不适。

            示例：

            喝完咖啡胸口不舒服

            我现在心跳特别快

            喝完奶茶一直想吐'
        - id: '2'
          label: 今日摄入咨询
          name: '用户询问今天还能不能喝咖啡、奶茶或其他饮品，询问剩余咖啡因、糖分预算，或者询问当天摄入是否过量。

            示例：

            我今天还能喝咖啡吗

            今天糖是不是超标了

            我还剩多少咖啡因预算'
        - id: '1784358768767'
          label: 饮品推荐
          name: '用户希望根据当前摄入、时间、睡眠和偏好获得具体饮品选择建议。

            示例：

            下午推荐喝什么

            想喝奶茶但又怕胖

            帮我选一杯低咖啡因饮品'
        - id: '1784358802379'
          label: 控糖与睡眠
          name: '用户讨论减少糖分、改善睡眠、咖啡因敏感、晚上喝咖啡、戒奶茶或培养饮品习惯。

            示例：

            怎么慢慢减少糖分

            晚上喝咖啡会影响睡眠吗

            我想控制奶茶摄入'
        - id: '1784358829641'
          label: 普通陪伴交流
          name: 不属于以上类别的普通聊天、情绪表达、感谢、闲聊或简单交流。
        - id: '1784363913596'
          label: 记录饮品或补充饮品信息
          name: '用户表示自己已经喝了、刚喝了、买了、点了某种饮品，或者明确要求记录、添加一杯饮品。


            也包括用户正在补充上一轮饮品记录缺少的信息，例如品牌、名称、杯量、毫升数、甜度或饮用时间。


            如果用户只是在询问某种饮品能不能喝、是否健康、咖啡因高不高或要求推荐，不属于本分类。'
        instruction: '分类时以“用户当前输入”为主要依据。


          最近聊天记录只用于判断当前输入是否是在补充上一轮尚未完成的饮品记录，例如用户只回答“大杯”“三分糖”“瑞幸的”时，应结合最近聊天判断是否属于记录饮品。


          不要因为最近聊天中出现过饮品名称，就把当前的感谢、打招呼或普通咨询错误分类为记录饮品。'
