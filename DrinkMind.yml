    - data:
        instruction: '# 任务


          从最近聊天记录和用户当前输入中，提取最近一条尚未完成的饮品记录信息。


          # 提取规则


          1. 只处理用户已经喝过、购买、点单或明确要求记录的饮品。

          2. 如果当前输入是在回答上一轮追问，应将当前补充信息与最近一条未完成的饮品记录合并。

          3. 不要提取更早的、已经完成或与当前记录无关的饮品。

          4. 不得编造用户没有提供的信息，无法确定时返回空值。


          # 字段标准


          brand：

          饮品品牌，例如瑞幸咖啡、库迪咖啡、星巴克。没有明确品牌时为空。


          name：

          具体饮品名称，例如生椰拿铁、冰美式、伯牙绝弦。无法确定时为空。


          type：

          只能使用以下值：

          coffee、teacoffee、tea、milktea、fruittea、soda、other。


          volume：

          输出毫升数。

          小杯或小瓶按250处理；

          中杯、中瓶或罐装按330处理；

          标准杯按350处理；

          大杯、大瓶或“一杯”按500处理；

          超大杯或巨杯按650处理。

          用户没有提供容量信息时为空。


          sugar：

          只能使用以下值：

          none、three、half、seven、full、unknown。


          无糖、不加糖、零糖、不另外加糖对应none；

          三分糖、微糖对应three；

          半糖、五分糖对应half；

          七分糖、少糖对应seven；

          全糖、正常糖对应full；

          用户明确表示不知道甜度时使用unknown；

          用户没有提到甜度时为空。


          time：

          刚刚、刚才、现在对应now；

          明确时间统一为HH:MM；

          上午对应morning；

          下午对应afternoon；

          晚上对应evening；

          没有提供时使用now。


          # 完整记录要求


          name、volume、sugar是形成完整饮品表单所需字段。

          brand可以为空。

          不得为了满足完整要求而猜测字段。'
